<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دعوة زفاف</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;background:#1c1710;color:#f3e4bd;font-family:serif}
div{padding:32px;border:1px solid #c9a24b;margin:16px;max-width:360px}h1{font-size:40px;margin:8px 0;color:#c9a24b}#c{font-size:22px;letter-spacing:2px}</style>
<div><p>يسرّنا دعوتكم لحضور زفاف</p><h1>سارة &amp; أحمد</h1><p>الجمعة 12 ديسمبر 2026</p><p id="c"></p></div>
<script>const t=new Date('2026-12-12T19:00:00'),f=()=>{const d=Math.max(0,t-Date.now());c.textContent=Math.floor(d/864e5)+' يوم '+Math.floor(d%864e5/36e5)+' ساعة'};f();setInterval(f,6e4)</script></html>
