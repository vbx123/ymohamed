<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مبروك التخرج</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d3b47;color:#e8fbfc;font-family:Tahoma,sans-serif;text-align:center;padding:20px}.c{border:2px solid #4fd1d8;border-radius:20px;padding:36px 28px;max-width:360px;background:#0f4a59}h1{font-size:38px;margin:10px 0;color:#7fe6ec}button{padding:10px 24px;border-radius:99px;border:1px solid #7fe6ec;background:none;color:#7fe6ec;font-size:16px;cursor:pointer}#r{opacity:0;transition:opacity .6s;margin-top:16px}#r.on{opacity:1}</style>
<div class="c"><div style="font-size:56px">🎓</div><h1>مبروك التخرج</h1><p>المهندس يوسف</p><button id="b">افتح الرسالة</button><p id="r">تعبك ما راح هدر، وهذه بداية الطريق.</p></div><script>b.onclick=()=>{r.classList.add('on');b.hidden=true}</script></html>
