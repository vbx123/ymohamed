<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عيد ميلاد</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;background:linear-gradient(160deg,#ff9ac8,#7b5cff);color:#fff;font-family:Tahoma,sans-serif;overflow:hidden}
h1{font-size:clamp(34px,10vw,64px);margin:0}.n{font-size:120px;font-weight:700;line-height:1}button{margin-top:20px;padding:12px 28px;border:0;border-radius:99px;background:#fff;color:#7b5cff;font-family:inherit;font-weight:700;font-size:18px;cursor:pointer}canvas{position:fixed;inset:0;pointer-events:none}</style>
<div><p>كل سنة وأنتِ طيبة</p><div class="n">25</div><h1>ليلى</h1><button id="b">احتفل 🎉</button></div><canvas id="c"></canvas>
<script>const c=document.getElementById('c'),x=c.getContext('2d');let p=[];function R(){c.width=innerWidth;c.height=innerHeight}R();onresize=R;
b.onclick=()=>{for(let i=0;i<120;i++)p.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14,h:Math.random()*360,l:90})};
(function t(){x.clearRect(0,0,c.width,c.height);p=p.filter(a=>a.l>0);p.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.4;a.l--;x.fillStyle='hsl('+a.h+',90%,60%)';x.fillRect(a.x,a.y,8,8)});requestAnimationFrame(t)})()</script></html>
